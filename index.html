<!DOCTYPE >
<html>
    <head>
        <title>Event Listener Example</title>
        <style>
            #myImage{
                width : "3px";
                height : "3px" solid transparent;
            }
            </style>
        </head>
        <body>
            <button id = "myButton">ClickMe</button>
            <br><br>
            image id = "myImage" src = "https://www.w3schools.com/images/w3schools_green.jpg"
            <script>
                document.getElementById("myButton").addEventListener
                ("click", function (){
                    console.log("Button clicked!"
                });

                

            </script> 
        </body>
</html>
